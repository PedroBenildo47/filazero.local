<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Rececionista a chamar a próxima senha num balcão de atendimento">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.5" stop-color="#131a3d"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="counter2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg2)"/>
  <circle cx="250" cy="170" r="300" fill="url(#glow2)" opacity="0.7"/>

  <!-- back screen -->
  <rect x="720" y="150" width="360" height="210" rx="18" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  <text x="900" y="250" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="30" fill="#94a3b8" letter-spacing="5">SENHA</text>
  <text x="900" y="330" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="84" font-weight="800" fill="#38bdf8">P-007</text>

  <!-- receptionist -->
  <g>
    <circle cx="430" cy="300" r="46" fill="#8d5a3b"/>
    <path d="M360 470 q70 -110 140 0 z" fill="#7c3aed"/>
    <rect x="360" y="430" width="140" height="60" rx="16" fill="#6d28d9"/>
    <!-- arm pressing the call button -->
    <path d="M500 430 q70 10 96 -18" stroke="#6d28d9" stroke-width="26" fill="none" stroke-linecap="round"/>
    <circle cx="608" cy="404" r="18" fill="#22c55e"/>
    <circle cx="608" cy="404" r="30" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.5"/>
  </g>

  <!-- counter -->
  <rect x="120" y="470" width="960" height="150" rx="18" fill="url(#counter2)" stroke="#475569" stroke-width="3"/>
  <rect x="120" y="470" width="960" height="16" rx="8" fill="#64748b" opacity="0.6"/>

  <!-- customer in front -->
  <g>
    <circle cx="820" cy="470" r="34" fill="#f4c9a8"/>
    <path d="M772 600 q48 -80 96 0 z" fill="#2563eb"/>
  </g>

  <!-- small info chip -->
  <rect x="180" y="530" width="230" height="56" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="295" y="566" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="24" fill="#e2e8f0">Fila Geral</text>
</svg>
