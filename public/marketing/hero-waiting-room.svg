<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Sala de espera moderna com uma pessoa a acompanhar a sua senha no telemóvel">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#141a3a"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg1)"/>
  <circle cx="960" cy="180" r="320" fill="url(#glow1)" opacity="0.7"/>
  <circle cx="180" cy="700" r="260" fill="#06b6d4" opacity="0.10"/>

  <!-- floor -->
  <rect x="0" y="600" width="1200" height="200" fill="#0a0f1c" opacity="0.55"/>
  <line x1="0" y1="600" x2="1200" y2="600" stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- wall display -->
  <rect x="640" y="120" width="420" height="240" rx="20" fill="url(#screen1)" stroke="#334155" stroke-width="3"/>
  <text x="850" y="240" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="34" fill="#94a3b8" letter-spacing="6">A ATENDER</text>
  <text x="850" y="330" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="96" font-weight="800" fill="#22c55e">A-042</text>
  <circle cx="676" cy="156" r="7" fill="#22c55e"/>

  <!-- waiting chairs -->
  <g fill="#1e293b" stroke="#334155" stroke-width="3">
    <rect x="120" y="470" width="150" height="26" rx="13"/>
    <rect x="120" y="500" width="26" height="110" rx="10"/>
    <rect x="244" y="500" width="26" height="110" rx="10"/>
    <rect x="300" y="470" width="150" height="26" rx="13"/>
    <rect x="300" y="500" width="26" height="110" rx="10"/>
    <rect x="424" y="500" width="26" height="110" rx="10"/>
    <rect x="480" y="470" width="150" height="26" rx="13"/>
    <rect x="480" y="500" width="26" height="110" rx="10"/>
    <rect x="604" y="500" width="26" height="110" rx="10"/>
  </g>

  <!-- person seated on the first chair -->
  <g>
    <circle cx="196" cy="398" r="34" fill="#f4c9a8"/>
    <path d="M150 470 q46 -60 92 0 v10 h-92 z" fill="#2563eb"/>
    <rect x="150" y="470" width="92" height="34" rx="12" fill="#1d4ed8"/>
    <path d="M150 500 q-24 10 -18 46" stroke="#1d4ed8" stroke-width="20" fill="none" stroke-linecap="round"/>
    <!-- phone with glow -->
    <rect x="196" y="430" width="46" height="74" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="204" y="440" width="30" height="54" rx="5" fill="#0ea5e9" opacity="0.85"/>
    <circle cx="219" cy="470" r="16" fill="none" stroke="#e0f2fe" stroke-width="4"/>
  </g>

  <!-- plant -->
  <g>
    <rect x="1010" y="500" width="70" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <path d="M1045 500 q-40 -70 0 -120 q40 50 0 120" fill="#22c55e" opacity="0.8"/>
  </g>
</svg>
